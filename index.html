<meta charset="UTF-8">
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.chat-wrapper { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.5rem; }
.chat-phone { background: #E5DDD5; border-radius: 16px; max-width: 400px; margin: 0 auto; overflow: hidden; }
.chat-header { background: #075E54; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.chat-avatar { width: 38px; height: 38px; border-radius: 50%; background: #128C7E; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
.chat-info { color: white; }
.chat-name { font-size: 15px; font-weight: 500; }
.chat-status { font-size: 11px; opacity: 0.8; }
.chat-messages { padding: 10px 10px 6px; min-height: 320px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 85%; padding: 7px 10px 5px; font-size: 13.5px; line-height: 1.5; position: relative; }
.msg-bot { background: white; border-radius: 0 10px 10px 10px; align-self: flex-start; color: #111; }
.msg-user { background: #DCF8C6; border-radius: 10px 0 10px 10px; align-self: flex-end; color: #111; }
.msg-time { font-size: 10px; color: #999; text-align: right; margin-top: 2px; }
.msg-typing { background: white; border-radius: 0 10px 10px 10px; align-self: flex-start; padding: 10px 14px; display: flex; gap: 4px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; animation: blink 1.2s infinite; }
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.options-wrap { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 5px; }
.opt-btn { background: white; border: 1px solid #128C7E; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: #128C7E; font-weight: 500; cursor: pointer; text-align: left; transition: background .15s; }
.opt-btn:hover { background: #e8f8f2; }
.chat-input-bar { background: #F0F0F0; padding: 8px 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ddd; }
.chat-input { flex: 1; border: none; border-radius: 20px; padding: 8px 14px; font-size: 13px; background: white; outline: none; }
.send-btn { width: 34px; height: 34px; border-radius: 50%; background: #128C7E; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
.step-info { text-align: center; margin-top: 1rem; font-size: 12px; color: var(--color-text-secondary); }
.reset-btn { display: block; margin: 0.75rem auto 0; padding: 6px 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 12px; cursor: pointer; color: var(--color-text-secondary); }
.reset-btn:hover { background: var(--color-background-secondary); }
.lead-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-top: 1rem; max-width: 400px; margin-left: auto; margin-right: auto; }
.lead-card-title { font-size: 13px; font-weight: 500; color: #128C7E; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.lead-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.lead-row:last-child { border: none; }
.lead-label { color: var(--color-text-secondary); }
.lead-val { font-weight: 500; color: var(--color-text-primary); }
.hidden { display: none; }
</style>

<h2 class="sr-only">Demo interactiva del chatbot para clínicas de estética — simula una conversación real de WhatsApp</h2>

<div class="chat-wrapper">
  <div class="chat-phone">
    <div class="chat-header">
      <div class="chat-avatar"><i class="ti ti-building-hospital" aria-hidden="true"></i></div>
      <div class="chat-info">
        <div class="chat-name">Clínica Estética BCN</div>
        <div class="chat-status">en línea</div>
      </div>
    </div>
    <div class="chat-messages" id="msgs"></div>
    <div class="options-wrap" id="opts"></div>
    <div class="chat-input-bar">
      <input class="chat-input" id="txt-input" placeholder="Escribe un mensaje..." readonly />
      <button class="send-btn" id="send-btn" onclick="handleSend()"><i class="ti ti-send" aria-hidden="true"></i></button>
    </div>
  </div>

  <div class="step-info" id="step-info">Paso 1 de 6 — Bienvenida</div>
  <button class="reset-btn" onclick="resetChat()"><i class="ti ti-refresh" aria-hidden="true"></i> Reiniciar demo</button>

  <div class="lead-card hidden" id="lead-card">
    <div class="lead-card-title"><i class="ti ti-bell-ringing" aria-hidden="true"></i> Lead capturado — aviso enviado al equipo</div>
    <div id="lead-rows"></div>
  </div>
</div>

<script>
const flow = [
  {
    step: "Bienvenida",
    bot: ["Hola, gracias por contactar con Clínica Estética BCN. Soy tu asistente virtual.", "¿En qué puedo ayudarte hoy?"],
    opts: ["Quiero saber precios", "Reservar una cita", "Información de tratamientos", "Hablar con el equipo"]
  },
  {
    step: "Tratamiento",
    bot: ["Perfecto. ¿Qué tratamiento te interesa?"],
    opts: ["Depilación láser", "Botox / Rellenos", "Tratamientos faciales", "Corporal / Reductiva"]
  },
  {
    step: "Primera vez",
    bot: ["La depilación láser diodo es nuestra especialidad.", "Precios desde 49€ según zona, con packs de 6 sesiones con descuento.", "¿Es la primera vez que te haces depilación láser?"],
    opts: ["Sí, es mi primera vez", "Ya me he hecho con otra clínica"]
  },
  {
    step: "Nombre",
    bot: ["Genial. Te ofrecemos una valoración gratuita sin compromiso.", "¿Cuál es tu nombre?"],
    input: true,
    placeholder: "Escribe tu nombre..."
  },
  {
    step: "Teléfono",
    bot: null,
    input: true,
    placeholder: "Escribe tu teléfono...",
    dynamic: true
  },
  {
    step: "Cita",
    bot: null,
    opts: ["Lunes tarde", "Miércoles tarde", "Viernes tarde"],
    dynamic: true
  },
  {
    step: "Confirmación",
    bot: null,
    end: true,
    dynamic: true
  }
];

let state = { step: 0, nombre: "", telefono: "", tratamiento: "", dia: "" };

function getTime() {
  const d = new Date();
  return d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0");
}

function addMsg(text, type) {
  const msgs = document.getElementById("msgs");
  const d = document.createElement("div");
  d.className = "msg msg-" + type;
  d.innerHTML = text.replace(/\n/g, "<br>") + '<div class="msg-time">' + getTime() + (type==="bot" ? " ✓✓" : " ✓✓") + "</div>";
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  return new Promise(res => {
    const msgs = document.getElementById("msgs");
    const d = document.createElement("div");
    d.className = "msg-typing";
    d.id = "typing";
    d.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => { d.remove(); res(); }, 900);
  });
}

function setOpts(options) {
  const wrap = document.getElementById("opts");
  wrap.innerHTML = "";
  if (!options) return;
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.onclick = () => handleOption(opt);
    wrap.appendChild(b);
  });
}

function setInput(placeholder) {
  const inp = document.getElementById("txt-input");
  inp.placeholder = placeholder || "Escribe un mensaje...";
  inp.readOnly = false;
  inp.value = "";
  inp.focus();
}

function clearInput() {
  const inp = document.getElementById("txt-input");
  inp.readOnly = true;
  inp.value = "";
  inp.placeholder = "Escribe un mensaje...";
}

function updateStepInfo(s) {
  document.getElementById("step-info").textContent = "Paso " + (state.step + 1) + " de 6 — " + s;
}

async function handleOption(opt) {
  setOpts(null);
  addMsg(opt, "user");
  if (state.step === 0) {
    state.step = 1;
    await showTyping();
    const f = flow[1];
    for (const t of f.bot) { addMsg(t, "bot"); }
    setOpts(f.opts);
    updateStepInfo(f.step);
  } else if (state.step === 1) {
    state.tratamiento = opt;
    state.step = 2;
    await showTyping();
    const f = flow[2];
    for (const t of f.bot) { addMsg(t, "bot"); }
    setOpts(f.opts);
    updateStepInfo(f.step);
  } else if (state.step === 2) {
    state.step = 3;
    await showTyping();
    const f = flow[3];
    for (const t of f.bot) { addMsg(t, "bot"); }
    setInput(f.placeholder);
    updateStepInfo(f.step);
  } else if (state.step === 5) {
    state.dia = opt;
    state.step = 6;
    await showTyping();
    addMsg("Reservado. Te confirmamos la cita el " + opt + ". Recibirás un recordatorio 24h antes.", "bot");
    await showTyping();
    addMsg("Si necesitas cambiarla, escríbenos aquí. Hasta pronto, " + state.nombre + ".", "bot");
    clearInput();
    setOpts(null);
    updateStepInfo("Completado");
    showLeadCard();
  }
}

async function handleSend() {
  const inp = document.getElementById("txt-input");
  const val = inp.value.trim();
  if (!val) return;
  inp.value = "";
  addMsg(val, "user");
  clearInput();
  if (state.step === 3) {
    state.nombre = val;
    state.step = 4;
    await showTyping();
    addMsg("Gracias, " + state.nombre + ". ¿Y un teléfono de contacto?", "bot");
    setInput("Escribe tu teléfono...");
    updateStepInfo("Teléfono");
  } else if (state.step === 4) {
    state.telefono = val;
    state.step = 5;
    await showTyping();
    addMsg("Perfecto. Tenemos disponibilidad esta semana. ¿Qué día te viene mejor?", "bot");
    setOpts(flow[5].opts);
    updateStepInfo("Cita");
  }
}

function showLeadCard() {
  const card = document.getElementById("lead-card");
  card.classList.remove("hidden");
  const rows = document.getElementById("lead-rows");
  const data = [
    ["Nombre", state.nombre || "Sara Test"],
    ["Teléfono", state.telefono || "612 345 678"],
    ["Tratamiento", state.tratamiento || "Depilación láser"],
    ["Día preferido", state.dia || "Viernes tarde"],
    ["Estado", "Nuevo lead"]
  ];
  rows.innerHTML = data.map(([l, v]) =>
    `<div class="lead-row"><span class="lead-label">${l}</span><span class="lead-val">${v}</span></div>`
  ).join("");
}

function resetChat() {
  state = { step: 0, nombre: "", telefono: "", tratamiento: "", dia: "" };
  document.getElementById("msgs").innerHTML = "";
  document.getElementById("opts").innerHTML = "";
  document.getElementById("lead-card").classList.add("hidden");
  clearInput();
  startChat();
}

async function startChat() {
  await showTyping();
  const f = flow[0];
  for (const t of f.bot) { addMsg(t, "bot"); }
  setOpts(f.opts);
  updateStepInfo(f.step);
}

startChat();
</script>
